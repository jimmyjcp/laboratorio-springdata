name: Reusable - Build Spring Boot & Docker

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: crudites-jar
          path: target/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t crudites:ci .

      # 👇👇👇 AQUÍ NACE EL TAG CONGELADO 👇👇👇
      - name: Create frozen tag
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: |
          TAG_NAME="feature-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG_NAME" -m "Frozen tag from feature pipeline"
          git push origin "$TAG_NAME"
