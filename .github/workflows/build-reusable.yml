name: Reusable - Build Spring Boot & Docker

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 👇 AQUÍ SE USAN LOS SECRETS (EN EL BUILD)
      - name: Build with Maven
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: crudites-jar
          path: target/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 👇 AQUÍ SE USA OTRO SECRET
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_IMAGE_NAME }}:ci .

      # 👇 AQUÍ NACE EL TAG CONGELADO
      - name: Create frozen tag
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: |
          TAG_NAME="feature-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG_NAME" -m "Frozen tag from feature pipeline"
          git push origin "$TAG_NAME"
